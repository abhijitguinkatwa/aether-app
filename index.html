<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050508">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AETHER</title>
<style>
:root {
  --bg: #050508;
  --glass: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.12);
  --accent: #00f0ff;
  --accent2: #ff00aa;
  --text: #ffffff;
  --text-dim: rgba(255,255,255,0.6);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  position: fixed;
}

#universe {
  position: fixed;
  top:0; left:0; width:100%; height:100%;
  z-index: 0;
}

.app {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: transparent;
}

.splash {
  position: fixed;
  top:0; left:0; width:100%; height:100%;
  background: var(--bg);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.8s ease, visibility 0.8s;
}
.splash.hidden { opacity:0; visibility:hidden; pointer-events:none; }
.splash-logo {
  width: 120px; height: 120px;
  border-radius: 30px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; font-weight: 200;
  letter-spacing: 4px;
  box-shadow: 0 0 60px rgba(0,240,255,0.3);
  animation: pulse 2s ease-in-out infinite;
}
.splash-text {
  margin-top: 24px;
  font-size: 28px;
  font-weight: 300;
  letter-spacing: 8px;
  background: linear-gradient(90deg, var(--text), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(0,240,255,0.3); }
  50% { transform: scale(1.05); box-shadow: 0 0 80px rgba(0,240,255,0.5); }
}

.header {
  padding: 20px 24px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header-title {
  font-size: 24px;
  font-weight: 300;
  letter-spacing: 4px;
  background: linear-gradient(90deg, #fff, var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header-sub {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 2px;
}

.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 20px 20px;
  position: relative;
}
.tab-panel { display: none; animation: fadeIn 0.4s ease; }
.tab-panel.active { display: block; }
@keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

.glass-card {
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.glass-card::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(0,240,255,0.08) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.glass-card:active::before { opacity: 1; }

.glow-screen {
  width: 100%;
  height: 200px;
  border-radius: 20px;
  margin-bottom: 20px;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(0,0,0,0.5);
}
.glow-screen.active {
  position: fixed;
  top:0; left:0; width:100vw; height:100vh;
  z-index: 500;
  border-radius: 0;
}
.glow-exit {
  position: absolute;
  top: 20px; right: 20px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  display: none; align-items: center; justify-content: center;
  font-size: 20px;
  z-index: 501;
}
.glow-screen.active .glow-exit { display: flex; }

.control-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  margin-bottom: 10px;
  margin-top: 16px;
}
input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.1);
  outline: none;
  margin-bottom: 16px;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 20px rgba(255,255,255,0.5);
  cursor: pointer;
  border: 2px solid var(--accent);
}

.color-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.color-btn {
  aspect-ratio: 1;
  border-radius: 14px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s;
  position: relative;
}
.color-btn.active { border-color: #fff; transform: scale(1.1); }
.color-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 14px;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
}

.scene-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.scene-btn {
  padding: 16px;
  border-radius: 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s;
  text-align: left;
  position: relative;
  overflow: hidden;
}
.scene-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.15;
  transition: opacity 0.3s;
}
.scene-btn:hover::before { opacity: 0.25; }
.scene-btn span { display: block; font-size: 11px; color: var(--text-dim); margin-top: 4px; }

.clock-display {
  font-size: 56px;
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  text-align: center;
  letter-spacing: 2px;
  margin: 20px 0;
  text-shadow: 0 0 40px rgba(0,240,255,0.3);
}
.date-display {
  text-align: center;
  color: var(--text-dim);
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 30px;
}

.timer-display {
  font-size: 64px;
  font-weight: 200;
  text-align: center;
  font-variant-numeric: tabular-nums;
  margin: 30px 0;
}
.timer-btn-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 20px;
}
.timer-btn {
  padding: 16px;
  border-radius: 16px;
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--glass-border);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.2s;
}
.timer-btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  font-weight: 600;
}

.breath-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 300px;
  position: relative;
}
.breath-circle {
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,240,255,0.2), transparent 70%);
  border: 2px solid rgba(0,240,255,0.3);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  transition: transform 0.1s linear;
}
.breath-circle::before {
  content: '';
  position: absolute;
  width: 100%; height: 100%;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.1);
  animation: breathRing 4s ease-in-out infinite;
}
@keyframes breathRing {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.5); opacity: 0; }
}
.breath-text {
  font-size: 18px;
  font-weight: 300;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-top: 40px;
  color: var(--accent);
}

.db-value {
  font-size: 72px;
  font-weight: 200;
  text-align: center;
  margin: 20px 0;
}
.db-unit {
  font-size: 24px;
  color: var(--text-dim);
}
.db-canvas {
  width: 100%;
  height: 150px;
  border-radius: 16px;
  background: rgba(0,0,0,0.2);
  margin-top: 20px;
}
.db-status {
  text-align: center;
  margin-top: 16px;
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.bottom-nav {
  display: flex;
  justify-content: space-around;
  padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
  background: rgba(5,5,8,0.8);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--glass-border);
}
.nav-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 0.3s;
  padding: 8px 12px;
  border-radius: 12px;
}
.nav-btn.active { color: var(--accent); }
.nav-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.ad-banner {
  height: 60px;
  background: rgba(255,255,255,0.03);
  border-top: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  font-size: 11px;
  letter-spacing: 1px;
}
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="splash-logo">A</div>
  <div class="splash-text">AETHER</div>
</div>

<canvas id="universe"></canvas>

<div class="app">
  <div class="header">
    <div>
      <div class="header-title">AETHER</div>
      <div class="header-sub" id="header-sub">Ambient Light</div>
    </div>
  </div>

  <div class="content">

    <div class="tab-panel active" id="tab-glow">
      <div class="glass-card">
        <div class="glow-screen" id="glow-screen" onclick="toggleFullscreenGlow()">
          <div class="glow-exit" onclick="event.stopPropagation(); toggleFullscreenGlow()">&#10005;</div>
        </div>
        <div class="control-label">Color</div>
        <div class="color-grid" id="color-grid"></div>
        <div class="control-label">Brightness</div>
        <input type="range" id="brightness" min="10" max="100" value="80">
        <div class="control-label">Scenes</div>
        <div class="scene-grid">
          <button class="scene-btn" onclick="setScene('candle')"><div>Candlelight</div><span>Warm flicker</span></button>
          <button class="scene-btn" onclick="setScene('ocean')"><div>Ocean</div><span>Calm blue waves</span></button>
          <button class="scene-btn" onclick="setScene('forest')"><div>Forest</div><span>Deep emerald</span></button>
          <button class="scene-btn" onclick="setScene('galaxy')"><div>Galaxy</div><span>Purple nebula</span></button>
          <button class="scene-btn" onclick="setScene('sunset')"><div>Sunset</div><span>Orange fade</span></button>
          <button class="scene-btn" onclick="setScene('neon')"><div>Neon</div><span>Cyberpunk pulse</span></button>
        </div>
        <div class="control-label">Tools</div>
        <div class="scene-grid">
          <button class="scene-btn" onclick="toggleStrobe()"><div>Strobe</div><span>Adjustable speed</span></button>
          <button class="scene-btn" onclick="triggerSOS()"><div>SOS</div><span>Emergency signal</span></button>
          <button class="scene-btn" onclick="setSleepTimer(15)"><div>Sleep 15m</div><span>Auto off</span></button>
          <button class="scene-btn" onclick="setSleepTimer(30)"><div>Sleep 30m</div><span>Auto off</span></button>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="tab-time">
      <div class="glass-card">
        <div class="clock-display" id="clock">00:00:00</div>
        <div class="date-display" id="date">Loading...</div>
      </div>
      <div class="glass-card">
        <div class="control-label">Timer</div>
        <div class="timer-display" id="timer-display">00:00</div>
        <div class="timer-btn-grid">
          <button class="timer-btn" onclick="addTimer(60)">+1m</button>
          <button class="timer-btn" onclick="addTimer(300)">+5m</button>
          <button class="timer-btn" onclick="addTimer(600)">+10m</button>
          <button class="timer-btn" onclick="resetTimer()">Reset</button>
          <button class="timer-btn primary" id="timer-toggle" onclick="toggleTimer()">Start</button>
          <button class="timer-btn" onclick="clearTimer()">Clear</button>
        </div>
      </div>
      <div class="glass-card">
        <div class="control-label">Stopwatch</div>
        <div class="timer-display" id="stopwatch-display">00:00.00</div>
        <div class="timer-btn-grid">
          <button class="timer-btn primary" id="sw-toggle" onclick="toggleStopwatch()">Start</button>
          <button class="timer-btn" onclick="lapStopwatch()">Lap</button>
          <button class="timer-btn" onclick="resetStopwatch()">Reset</button>
        </div>
        <div id="laps" style="margin-top:16px;max-height:150px;overflow-y:auto;"></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-calm">
      <div class="glass-card" style="min-height:400px;">
        <div class="breath-container">
          <div class="breath-circle" id="breath-circle">
            <div style="font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);">Breathe</div>
          </div>
          <div class="breath-text" id="breath-text">Inhale</div>
          <div style="margin-top:20px;color:var(--text-dim);font-size:12px;letter-spacing:1px;">4-7-8 Technique</div>
        </div>
        <div class="timer-btn-grid" style="margin-top:20px;">
          <button class="timer-btn primary" id="breath-toggle" onclick="toggleBreathing()">Start</button>
          <button class="timer-btn" onclick="resetBreathing()">Reset</button>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="tab-decibel">
      <div class="glass-card">
        <div class="db-value" id="db-value">--<span class="db-unit">dB</span></div>
        <div class="db-status" id="db-status">Tap Start to monitor</div>
        <canvas class="db-canvas" id="db-canvas"></canvas>
        <div class="timer-btn-grid" style="margin-top:20px;">
          <button class="timer-btn primary" id="db-toggle" onclick="toggleDecibel()">Start Monitor</button>
          <button class="timer-btn" onclick="resetDecibel()">Reset</button>
        </div>
        <div style="margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;">
          <div style="padding:10px;background:rgba(255,255,255,0.05);border-radius:12px;">
            <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;">Min</div>
            <div id="db-min" style="font-size:20px;margin-top:4px;">--</div>
          </div>
          <div style="padding:10px;background:rgba(255,255,255,0.05);border-radius:12px;">
            <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;">Avg</div>
            <div id="db-avg" style="font-size:20px;margin-top:4px;">--</div>
          </div>
          <div style="padding:10px;background:rgba(255,255,255,0.05);border-radius:12px;">
            <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;">Max</div>
            <div id="db-max" style="font-size:20px;margin-top:4px;">--</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="ad-banner">Advertisement Space</div>

  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('glow', 'Ambient Light')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      Glow
    </button>
    <button class="nav-btn" onclick="switchTab('time', 'Chronos')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Time
    </button>
    <button class="nav-btn" onclick="switchTab('calm', 'Breath')">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/><path d="M12 6v6l4 2"/></svg>
      Calm
    </button>
    <button class="nav-btn" onclick="switchTab('decibel', 'Sonic')">
      <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      Sonic
    </button>
  </div>
</div>

<script>
const canvas = document.getElementById('universe');
const ctx = canvas.getContext('2d');
let particles = [];
const particleCount = 60;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 0.5;
    this.speedX = (Math.random() - 0.5) * 0.3;
    this.speedY = (Math.random() - 0.5) * 0.3;
    this.opacity = Math.random() * 0.5 + 0.2;
    this.hue = Math.random() > 0.5 ? 180 : 320;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = 'hsla(' + this.hue + ', 80%, 60%, ' + this.opacity + ')';
    ctx.fill();
  }
}

for (let i = 0; i < particleCount; i++) particles.push(new Particle());

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width);
  gradient.addColorStop(0, 'rgba(10,10,30,0.3)');
  gradient.addColorStop(1, 'rgba(5,5,8,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles.forEach(p => {
    p.update();
    p.draw();
  });

  particles.forEach((p1, i) => {
    particles.slice(i + 1).forEach(p2 => {
      const dx = p1.x - p2.x;
      const dy = p1.y - p2.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 100) {
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = 'rgba(0,240,255,' + (0.1 * (1 - dist/100)) + ')';
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    });
  });

  requestAnimationFrame(animateParticles);
}
animateParticles();

setTimeout(() => {
  document.getElementById('splash').classList.add('hidden');
}, 2000);

function switchTab(tab, subtitle) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('header-sub').textContent = subtitle;
}

const colors = [
  '#ffffff', '#fff5e6', '#ffe0b2', '#ffcc80', '#ffab91',
  '#ff8a65', '#ff7043', '#f06292', '#e91e63', '#9c27b0',
  '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4',
  '#009688', '#4caf50', '#8bc34a', '#cddc39', '#ffeb3b'
];
const colorGrid = document.getElementById('color-grid');
let currentColor = '#ffffff';
let glowInterval = null;
let isFullscreen = false;

colors.forEach((c, i) => {
  const btn = document.createElement('div');
  btn.className = 'color-btn' + (i === 0 ? ' active' : '');
  btn.style.background = c;
  btn.onclick = () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentColor = c;
    updateGlow();
  };
  colorGrid.appendChild(btn);
});

function updateGlow() {
  const screen = document.getElementById('glow-screen');
  const brightness = document.getElementById('brightness').value;
  screen.style.background = currentColor;
  screen.style.opacity = brightness / 100;
  screen.style.boxShadow = '0 0 ' + brightness + 'px ' + currentColor + '40';
}

document.getElementById('brightness').addEventListener('input', updateGlow);
updateGlow();

function toggleFullscreenGlow() {
  const screen = document.getElementById('glow-screen');
  isFullscreen = !isFullscreen;
  screen.classList.toggle('active', isFullscreen);
  if (isFullscreen) {
    screen.style.background = currentColor;
    screen.style.opacity = document.getElementById('brightness').value / 100;
  }
}

function setScene(name) {
  const scenes = {
    candle: { colors: ['#ff9800', '#ff5722', '#ffcc80'], speed: 800 },
    ocean: { colors: ['#0277bd', '#4fc3f7', '#01579b'], speed: 2000 },
    forest: { colors: ['#2e7d32', '#66bb6a', '#1b5e20'], speed: 3000 },
    galaxy: { colors: ['#7b1fa2', '#e91e63', '#311b92'], speed: 4000 },
    sunset: { colors: ['#ff5722', '#ff9800', '#f44336'], speed: 2500 },
    neon: { colors: ['#00e5ff', '#ff00e5', '#76ff03'], speed: 500 }
  };
  const s = scenes[name];
  if (!s) return;
  let i = 0;
  clearInterval(glowInterval);
  glowInterval = setInterval(() => {
    currentColor = s.colors[i % s.colors.length];
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    updateGlow();
    i++;
  }, s.speed);
}

function toggleStrobe() {
  if (glowInterval) { clearInterval(glowInterval); glowInterval = null; return; }
  glowInterval = setInterval(() => {
    const screen = document.getElementById('glow-screen');
    screen.style.opacity = screen.style.opacity === '1' ? '0.1' : '1';
  }, 100);
}

function triggerSOS() {
  if (glowInterval) clearInterval(glowInterval);
  let i = 0;
  glowInterval = setInterval(() => {
    const screen = document.getElementById('glow-screen');
    screen.style.opacity = i % 2 === 0 ? '1' : '0.1';
    i++;
    if (i >= 18) { clearInterval(glowInterval); glowInterval = null; updateGlow(); }
  }, 300);
}

let sleepTimeout = null;
function setSleepTimer(minutes) {
  if (sleepTimeout) clearTimeout(sleepTimeout);
  sleepTimeout = setTimeout(() => {
    document.getElementById('brightness').value = 0;
    updateGlow();
    alert('Sleep timer expired');
  }, minutes * 60000);
  alert('Sleep timer set for ' + minutes + ' minutes');
}

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', {hour12:false});
  document.getElementById('date').textContent = now.toLocaleDateString('en-US', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
}
setInterval(updateClock, 1000);
updateClock();

let timerSeconds = 0;
let timerInterval = null;
let timerRunning = false;

function addTimer(secs) {
  timerSeconds += secs;
  updateTimerDisplay();
}
function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
  const s = (timerSeconds % 60).toString().padStart(2, '0');
  document.getElementById('timer-display').textContent = m + ':' + s;
}
function toggleTimer() {
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    document.getElementById('timer-toggle').textContent = 'Start';
  } else {
    if (timerSeconds <= 0) return;
    timerRunning = true;
    document.getElementById('timer-toggle').textContent = 'Pause';
    timerInterval = setInterval(() => {
      timerSeconds--;
      updateTimerDisplay();
      if (timerSeconds <= 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        document.getElementById('timer-toggle').textContent = 'Start';
        alert('Timer complete');
      }
    }, 1000);
  }
}
function resetTimer() { timerSeconds = 0; updateTimerDisplay(); }
function clearTimer() { resetTimer(); if (timerRunning) toggleTimer(); }

let swStart = 0;
let swElapsed = 0;
let swRunning = false;
let swInterval = null;

function toggleStopwatch() {
  if (swRunning) {
    clearInterval(swInterval);
    swRunning = false;
    document.getElementById('sw-toggle').textContent = 'Resume';
  } else {
    swStart = Date.now() - swElapsed;
    swRunning = true;
    document.getElementById('sw-toggle').textContent = 'Pause';
    swInterval = setInterval(() => {
      swElapsed = Date.now() - swStart;
      updateStopwatch();
    }, 10);
  }
}
function updateStopwatch() {
  const total = Math.floor(swElapsed / 10);
  const m = Math.floor(total / 6000).toString().padStart(2, '0');
  const s = Math.floor((total % 6000) / 100).toString().padStart(2, '0');
  const ms = (total % 100).toString().padStart(2, '0');
  document.getElementById('stopwatch-display').textContent = m + ':' + s + '.' + ms;
}
function lapStopwatch() {
  if (!swRunning && swElapsed === 0) return;
  const lap = document.createElement('div');
  lap.style.cssText = 'padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.1);font-variant-numeric:tabular-nums;';
  lap.textContent = document.getElementById('stopwatch-display').textContent;
  document.getElementById('laps').prepend(lap);
}
function resetStopwatch() {
  clearInterval(swInterval);
  swRunning = false;
  swElapsed = 0;
  document.getElementById('sw-toggle').textContent = 'Start';
  updateStopwatch();
  document.getElementById('laps').innerHTML = '';
}

let breathRunning = false;
let breathInterval = null;
let breathPhase = 0;

function toggleBreathing() {
  if (breathRunning) {
    clearInterval(breathInterval);
    breathRunning = false;
    document.getElementById('breath-toggle').textContent = 'Start';
    document.getElementById('breath-circle').style.transform = 'scale(1)';
  } else {
    breathRunning = true;
    document.getElementById('breath-toggle').textContent = 'Stop';
    runBreathCycle();
    breathInterval = setInterval(runBreathCycle, 19000);
  }
}
function runBreathCycle() {
  const circle = document.getElementById('breath-circle');
  const text = document.getElementById('breath-text');

  text.textContent = 'Inhale';
  circle.style.transition = 'transform 4s ease-in-out';
  circle.style.transform = 'scale(1.5)';

  setTimeout(() => {
    if (!breathRunning) return;
    text.textContent = 'Hold';
    circle.style.transition = 'transform 7s linear';
    circle.style.transform = 'scale(1.5)';
  }, 4000);

  setTimeout(() => {
    if (!breathRunning) return;
    text.textContent = 'Exhale';
    circle.style.transition = 'transform 8s ease-in-out';
    circle.style.transform = 'scale(1)';
  }, 11000);
}
function resetBreathing() {
  clearInterval(breathInterval);
  breathRunning = false;
  document.getElementById('breath-toggle').textContent = 'Start';
  document.getElementById('breath-circle').style.transform = 'scale(1)';
  document.getElementById('breath-text').textContent = 'Inhale';
  breathPhase = 0;
}

let audioContext = null;
let analyser = null;
let microphone = null;
let dbRunning = false;
let dbAnimation = null;
let dbValues = [];
const dbCanvas = document.getElementById('db-canvas');
const dbCtx = dbCanvas.getContext('2d');

function resizeDbCanvas() {
  dbCanvas.width = dbCanvas.offsetWidth;
  dbCanvas.height = dbCanvas.offsetHeight;
}
resizeDbCanvas();
window.addEventListener('resize', resizeDbCanvas);

async function toggleDecibel() {
  if (dbRunning) {
    dbRunning = false;
    cancelAnimationFrame(dbAnimation);
    if (microphone) microphone.disconnect();
    if (audioContext) audioContext.close();
    document.getElementById('db-toggle').textContent = 'Start Monitor';
    document.getElementById('db-status').textContent = 'Monitoring stopped';
    return;
  }

  try {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    microphone = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    microphone.connect(analyser);

    dbRunning = true;
    document.getElementById('db-toggle').textContent = 'Stop Monitor';
    document.getElementById('db-status').textContent = 'Monitoring active';
    dbValues = [];
    drawDecibel();
  } catch (err) {
    alert('Microphone access required for sound monitoring');
  }
}

function drawDecibel() {
  if (!dbRunning) return;
  dbAnimation = requestAnimationFrame(drawDecibel);

  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);
  analyser.getByteFrequencyData(dataArray);

  let sum = 0;
  for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
  const average = sum / bufferLength;

  const db = Math.max(30, Math.min(120, Math.round(30 + (average / 255) * 90)));
  dbValues.push(db);
  if (dbValues.length > 50) dbValues.shift();

  document.getElementById('db-value').innerHTML = db + '<span class="db-unit">dB</span>';
  document.getElementById('db-min').textContent = Math.min.apply(null, dbValues);
  document.getElementById('db-max').textContent = Math.max.apply(null, dbValues);
  document.getElementById('db-avg').textContent = Math.round(dbValues.reduce((a,b)=>a+b,0)/dbValues.length);

  const status = document.getElementById('db-status');
  if (db < 60) { status.textContent = 'Quiet'; status.style.color = '#4caf50'; }
  else if (db < 80) { status.textContent = 'Moderate'; status.style.color = '#ff9800'; }
  else { status.textContent = 'Loud'; status.style.color = '#f44336'; }

  dbCtx.fillStyle = 'rgba(0,0,0,0.2)';
  dbCtx.fillRect(0, 0, dbCanvas.width, dbCanvas.height);

  const barWidth = dbCanvas.width / bufferLength;
  let x = 0;

  for (let i = 0; i < bufferLength; i++) {
    const barHeight = (dataArray[i] / 255) * dbCanvas.height;
    const hue = 180 + (dataArray[i] / 255) * 140;
    dbCtx.fillStyle = 'hsla(' + hue + ', 80%, 60%, 0.8)';
    dbCtx.fillRect(x, dbCanvas.height - barHeight, barWidth - 1, barHeight);
    x += barWidth;
  }
}

function resetDecibel() {
  dbValues = [];
  document.getElementById('db-min').textContent = '--';
  document.getElementById('db-max').textContent = '--';
  document.getElementById('db-avg').textContent = '--';
  document.getElementById('db-value').innerHTML = '--<span class="db-unit">dB</span>';
}

if ('wakeLock' in navigator) {
  let wakeLock = null;
  async function requestWakeLock() {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && isFullscreen) requestWakeLock();
  });
}
